<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Website Header Design</title>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        z-index: 999999;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .preloader-ring {
        display: inline-block;
        position: relative;
        width: 50px;
        height: 50px;
      }
      .preloader-ring div {
        box-sizing: border-box;
        display: block;
        position: absolute;
        width: 38px;
        height: 38px;
        margin: 6px;
        border: 3.5px solid #EA580C;
        border-radius: 50%;
        animation: preloader-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        border-color: #EA580C transparent transparent transparent;
      }
      .preloader-ring div:nth-child(1) {
        animation-delay: -0.45s;
      }
      .preloader-ring div:nth-child(2) {
        animation-delay: -0.3s;
      }
      .preloader-ring div:nth-child(3) {
        animation-delay: -0.15s;
      }
      @keyframes preloader-ring {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-D6cxLdGv.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B8LNf_pg.css">
  </head>

  <body>
    <div id="app-preloader">
      <div class="preloader-ring">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
